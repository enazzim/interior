version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: interior-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    restart: always

  frontend:
    build:
      context: ./frontend
    container_name: interior-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
